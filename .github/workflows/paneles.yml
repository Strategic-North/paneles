name: Actualizar paneles

on:
  schedule:
    # Cada 30 minutos. GitHub usa UTC: 02:00 UTC = 20:00 h CDMX (hora del corte).
    - cron: "7,37 * * * *"
    # Corridas extra alrededor del corte: 19:47, 19:57, 20:03, 20:13 y 20:23 h CDMX.
    # GitHub retrasa las programadas de 15 a 55 minutos en horas de carga; con varias,
    # alguna suele llegar a tiempo. Se evitan los minutos en punto, que son los más cargados.
    - cron: "47,57 1 * * *"
    - cron: "3,13,23 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paneles
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar paneles
        run: python generar.py
      - name: Guardar cambios
        run: |
          git config user.name "paneles-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualización $(TZ=America/Mexico_City date +'%Y-%m-%d %H:%M') CDMX"
            git push
          fi
